{
  "name": "Bug",
  "description": "Propose a bug for agent triage",
  "title": "[bug] ",
  "body": [
    {
      "type": "dropdown",
      "id": "priority",
      "attributes": {
        "label": "Priority",
        "options": [
          "P0 - critical outage",
          "P1 - high impact",
          "P2 - normal",
          "P3 - low"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-0",
      "attributes": {
        "label": "Environment",
        "description": "Version/commit, OS and runtime."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-1",
      "attributes": {
        "label": "Reproduction",
        "description": "Minimal steps or reproducible example."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-2",
      "attributes": {
        "label": "Expected behavior",
        "description": "What should happen?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-3",
      "attributes": {
        "label": "Actual behavior",
        "description": "What happened? Include sanitized logs."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-4",
      "attributes": {
        "label": "Impact",
        "description": "Affected users, frequency and workaround."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-5",
      "attributes": {
        "label": "Acceptance criteria",
        "description": "One AC-N block per criterion. State the observable outcome, a misleading result that must fail, and how it will be checked.",
        "placeholder": "AC-1: Territory colors\nOutcome: Geographic polygon fills change with the selected date.\nCounterexample: Only the legend or event marker changes color.\nVerification: Compare actual map fills at two sourced dates in the browser."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "dependencies",
      "attributes": {
        "label": "Dependencies",
        "description": "Optional prerequisite Issue numbers, e.g. #12 #13. Leave blank if none."
      },
      "validations": {
        "required": false
      }
    }
  ]
}
