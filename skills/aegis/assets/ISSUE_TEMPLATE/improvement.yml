{
  "name": "Improvement",
  "description": "Propose a improvement for agent triage",
  "title": "[improvement] ",
  "body": [
    {
      "type": "dropdown",
      "id": "priority",
      "attributes": {
        "label": "Priority",
        "options": [
          "P0 - critical outage",
          "P1 - high impact",
          "P2 - normal",
          "P3 - low"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-0",
      "attributes": {
        "label": "Background",
        "description": "Current limitation and evidence."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-1",
      "attributes": {
        "label": "Expected benefit",
        "description": "Performance, maintainability or usability target."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-2",
      "attributes": {
        "label": "Scope and exclusions",
        "description": "Boundaries and compatibility."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-3",
      "attributes": {
        "label": "Acceptance criteria",
        "description": "List unique acceptance IDs: AC-1: observable result; AC-2: observable result."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "dependencies",
      "attributes": {
        "label": "Dependencies",
        "description": "Optional prerequisite Issue numbers, e.g. #12 #13. Leave blank if none."
      },
      "validations": {
        "required": false
      }
    }
  ]
}
