{
  "name": "Feature",
  "description": "Propose a feature for agent triage",
  "title": "[feature] ",
  "body": [
    {
      "type": "dropdown",
      "id": "priority",
      "attributes": {
        "label": "Priority",
        "options": [
          "P0 - critical outage",
          "P1 - high impact",
          "P2 - normal",
          "P3 - low"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-0",
      "attributes": {
        "label": "Background",
        "description": "Who has the problem and in which scenario?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-1",
      "attributes": {
        "label": "Expected benefit",
        "description": "What measurable outcome improves?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-2",
      "attributes": {
        "label": "Scope and exclusions",
        "description": "What is included and excluded?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-3",
      "attributes": {
        "label": "Acceptance criteria",
        "description": "Observable conditions for completion."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-4",
      "attributes": {
        "label": "Alternatives and compatibility",
        "description": "Alternatives considered, API/data changes, migration and rollback."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
