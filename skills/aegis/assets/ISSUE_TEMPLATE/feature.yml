{
  "name": "Feature",
  "description": "Propose a feature for agent triage",
  "title": "[feature] ",
  "body": [
    {
      "type": "dropdown",
      "id": "priority",
      "attributes": {
        "label": "Priority",
        "options": [
          "P0 - critical outage",
          "P1 - high impact",
          "P2 - normal",
          "P3 - low"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-0",
      "attributes": {
        "label": "Background",
        "description": "Who has the problem and in which scenario?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-1",
      "attributes": {
        "label": "Expected benefit",
        "description": "What measurable outcome improves?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-2",
      "attributes": {
        "label": "Scope and exclusions",
        "description": "What is included and excluded?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-3",
      "attributes": {
        "label": "Acceptance criteria",
        "description": "One AC-N block per criterion. State the observable outcome, a misleading result that must fail, and how it will be checked.",
        "placeholder": "AC-1: Territory colors\nOutcome: Geographic polygon fills change with the selected date.\nCounterexample: Only the legend or event marker changes color.\nVerification: Compare actual map fills at two sourced dates in the browser."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-4",
      "attributes": {
        "label": "Alternatives and compatibility",
        "description": "Alternatives considered, API/data changes, migration and rollback."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "dependencies",
      "attributes": {
        "label": "Dependencies",
        "description": "Optional prerequisite Issue numbers, e.g. #12 #13. Leave blank if none."
      },
      "validations": {
        "required": false
      }
    }
  ]
}
